device: 0
save_dir: 'log'

# SN-PCFG default hyperparameters. NT, T (= 2 * NT), and s_dim are overridden by the
# sweep launcher per combination. seed is supplied via --seed on the
# command line. Data path is aligned with the HN-PCFG eji18kkl reference
# run for an apples-to-apples comparison.

data:
  train_file: 'data/clean/english-train.pickle'
  val_file: 'data/clean/english-val.pickle'
  test_file: 'data/clean/english-test.pickle'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2

model:
  model_name: 'SNPCFG'
  NT: 4096
  T: 8192
  s_dim: 512

train:
  batch_size: 16
  max_epoch: 30
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 5
  clip: 3

test:
  batch_size: 16
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 0.002
  mu: 0.75
  nu: 0.999

wandb:
  enabled: true
  project: 'hol-pcfg'
  run_name: 'snpcfg-nt-sdim-sweep'
  tags: ['snpcfg', 'nt-sdim-sweep']
