# SN-PCFG SemInfo sweep template.
#
# Mirrors snpcfg_nt1024_t2048_en.spacy-10k-merged-0pas-fast-6-3-rlstart0.yaml
# (project default for SN-PCFG SemInfo training on English PTB). NT, T
# (= 2 * NT), and s_dim are overridden per (NT, s_dim) combination by the
# sweep launcher. Seed is provided via PL_GLOBAL_SEED / PYTHONHASHSEED env
# vars at launch time (not via config).
#
# NOTE: this config has `experimental.mode: nll` and `mode_reward: 'none'`.
# The launcher overrides these at runtime with `--set_training_mode rl
# --set_mode_reward log_tfidf` so SN-PCFG is trained with SemInfo, matching
# the existing scripts/run_multiseed_baseline.sh convention.

device: 0
save_dir : 'log'

data:
  train_file: 'data/english/ptb_en-full.gd_instruction.batch.gpt4omini-ew-exp-tbtok-idf/train.pickle'
  val_file: 'data/english/ptb_en-full.gd_instruction.batch.gpt4omini-ew-exp-tbtok-idf/val.pickle'
  test_file: 'data/english/ptb_en-full.gd_instruction.batch.gpt4omini-ew-exp-tbtok-idf/test.pickle'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2


model:
  model_name: 'SNPCFG-FixedCostReward'
  NT: 1024
  T: 2048
  s_dim: 512
  w_dim: 512
  h_dim: 512
  z_dim: 64
  r_dim: -1
  operation_space: normal
  entropy: False
  use_fast_pcfg: True


experimental:
  min_span_reward: -4.
  alignment_coefficient: 1.
  adversarial_coefficient: 0.

  pas_subsample_count: 0
  renormalizing_marginals: False

  weigh_nll_loss: True
  suppress_pas_contrib: False

  flag_curriculum_learning: False

  mode: "nll"
  hit_count_threshold: 2
  activation_flood: 0.001

  mode_offending_spans: True
  spancomp_loss_weight: 4.

  rl_warmup_steps: 5000
  rl_start_step: 0
  rl_initial_coeff: 0.
  rl_target_coeff: 1.
  rl_len_norm: False
  apply_mean_baseline: True

  maxent_initial_coeff: -0.01
  maxent_target_coeff: -0.01
  mode_reward: 'none'


train:
  batch_size: 4
  max_epoch: 10
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 5
  clip: 3


test:
  batch_size: 2
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'


optimizer:
  name: 'adam'
  lr: 0.001
  mu: 0.75
  nu: 0.999
