device: 0
save_dir : 'log/optuna_phase2'

data:
  train_file: 'data/ptb-train.pickle'
  val_file: 'data/ptb-val.pickle'
  test_file: 'data/ptb-test.pickle'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2

model:
  model_name: 'HNPCFG'
  NT: 4096
  T: 8192
  s_dim: 512
  projection_mode: 'freq_cnorm'
  use_cnorm: False
  use_relation_projection_cnorm: True
  use_global_scale: False
  use_temperature: True

train:
  batch_size: 16
  max_epoch: 30
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 8
  clip: 3

test:
  batch_size: 16
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 0.00323511348682184
  mu: 0.5
  nu: 0.99
  relation_weight_decay: 0.0

wandb:
  enabled: True
  project: 'hol-pcfg'
  run_name: 'optuna-phase2-rank5'
  tags: ['optuna', 'phase2', 'rank5']
