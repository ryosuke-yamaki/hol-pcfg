# Tiny smoke config for the character-level KTB pipeline. Validates the full
# data -> model -> CYK -> UF1 path on a few sentences with a minimal grammar.
# NOT for real results.

device: 0
save_dir: 'log'

data:
  train_file: 'data/data.clean/japanese-ktb-char-smoke-train.pickle'
  val_file:   'data/data.clean/japanese-ktb-char-smoke-val.pickle'
  test_file:  'data/data.clean/japanese-ktb-char-smoke-test.pickle'
  vocab_type: 'max_size'
  vocab_size: 500
  min_freq: 1

model:
  model_name: 'HNPCFG'
  NT: 16
  T: 8
  s_dim: 32
  tau_root_init: 1.96639395077448
  tau_rule_init: 12.737609884132324
  tau_term_init: 9.242005338216677

train:
  batch_size: 2
  max_epoch: 1
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 10
  clip: 3

test:
  batch_size: 2
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 0.002576751484771699
  mu: 0.75
  nu: 0.999
  relation_weight_decay: 0.0

wandb:
  enabled: false
  project: 'hol-pcfg'
  run_name: 'hnpcfg-ja-char-smoke'
  tags: ['hnpcfg', 'ja', 'ktb', 'char', 'smoke']
