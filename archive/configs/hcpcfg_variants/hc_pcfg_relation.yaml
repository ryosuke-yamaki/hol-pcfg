device: 0
save_dir: 'log'

data:
  train_file: 'data/ptb-train.pickle'
  val_file: 'data/ptb-val.pickle'
  test_file: 'data/ptb-test.pickle'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2

model:
  model_name: 'HCPCFG'
  NT: 2048
  T: 4096
  s_dim: 512
  z_dim: 64
  h_dim: 512
  w_dim: 512
  projection_mode: 'freq_cnorm'
  use_cnorm: False
  use_relation_projection_cnorm: True
  use_temperature: True
  z_inject_mode: 'relation'
  use_checkpoint: False

train:
  batch_size: 16
  max_epoch: 30
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 5
  clip: 3
  kl_warmup_epochs: 10

test:
  batch_size: 16
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 0.002
  mu: 0.75
  nu: 0.999
  relation_weight_decay: 0.01

wandb:
  enabled: True
  project: 'hol-pcfg'
  run_name: 'hcpcfg-relation'
  tags: ['hcpcfg', 'relation-inject', 'freq-cnorm', 'relation-proj-cnorm', 'single-tau']
