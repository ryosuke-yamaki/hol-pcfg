device: 0
save_dir: 'log'

data:
  train_file: 'data/data.clean/english-train.pkl'
  val_file: 'data/data.clean/english-val.pkl'
  test_file: 'data/data.clean/english-test.pkl'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2

model:
  model_name: 'HNPCFG'
  NT: 8192
  T: 16384
  s_dim: 512
  tau_root_init: 2.0
  tau_term_init: 9.0
  tau_rule_init: 12.5

train:
  batch_size: 16
  max_epoch: 30
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 10
  clip: 3

test:
  batch_size: 16
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 2.5e-3
  mu: 0.75
  nu: 0.999
  relation_weight_decay: 0.0

wandb:
  enabled: true
  project: 'hol-pcfg'
  run_name: 'hnpcfg-v2hp-en-nt8192'
  tags: ['hnpcfg', 'nt8192', 'v2hp', 'paper', 'en']
