device: 0
save_dir : 'log'

data:
  train_file: 'data/ptb-train.pickle'
  val_file: 'data/ptb-val.pickle'
  test_file: 'data/ptb-test.pickle'
  vocab_type: 'max_size'
  vocab_size: 10000
  min_freq: 2

model:
  model_name: 'HNPCFG'
  NT: 4096
  T: 8192
  s_dim: 512
  fixed_scale: 10.0

train:
  batch_size: 16
  max_epoch: 30
  max_len: 40
  curriculum: 0
  start_len: 30
  increment: 1
  patience: 5
  clip: 3

test:
  batch_size: 16
  max_tokens: 100
  bucket: 32
  decode: 'mbr'
  sampler: 'batch'

optimizer:
  name: 'adam'
  lr: 0.002
  mu: 0.75
  nu: 0.999
  relation_weight_decay: 0.01

wandb:
  enabled: True
  project: 'hol-pcfg'
  run_name: 'hnpcfg-nt4096-normless1-fixedscale10'
  tags: ['hn-pcfg', 'normless1', 'fixed-scale-10']
